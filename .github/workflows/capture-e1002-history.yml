name: Capture E1002 Sensor History

on:
  schedule:
    # Four opportunities every hour.
    # Only one reading per ~hour will actually be saved.
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e1002-sensor-history
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Capture E1002 data and build static Health Monitor v2
        env:
          SENSECRAFT_API_KEY: ${{ secrets.SENSECRAFT_API_KEY }}
        run: node scripts/e1002-health-v2.mjs

      - name: Commit sensor history and static dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/sensor-history.json \
            data/e1002-status-history.csv \
            index.html

          if git diff --cached --quiet; then
            echo "No E1002 changes to commit."
            exit 0
          fi

          git commit -m "Update E1002 sensor history and static dashboard"
          git push
