name: Capture E1002 Sensor History

on:
  schedule:
    # Two opportunities every hour.
    # Only one reading per ~hour will actually be saved.
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e1002-sensor-history
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch E1002 sensor values and update history
        env:
          SENSECRAFT_API_KEY: ${{ secrets.SENSECRAFT_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const deviceId = "20230256";

          // Keep approximately one year of data.
          const retentionDays = 366;

          // We schedule GitHub twice per hour for redundancy,
          // but normally save only one reading per hour.
          const minimumSpacingMinutes = 50;

          const endpoint =
            `https://sensecraft-hmi-api.seeed.cc/api/v1/user/device/iot_data/${deviceId}`;

          const folder = "data";

          const historyFile =
            path.join(
              folder,
              "sensor-history.json"
            );

          const csvFile =
            path.join(
              folder,
              "e1002-status-history.csv"
            );

          function csvEscape(value) {
            const text =
              value === null || value === undefined
                ? ""
                : String(value);

            return `"${text.replace(/"/g, '""')}"`;
          }

          function statusLabel(rawStatus) {
            if (rawStatus === 1) return "Online";
            if (rawStatus === 3) return "Sleep";
            return "Unknown";
          }

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          async function fetchWithRetry(url, options, attempts = 3) {
            let lastError;

            for (let attempt = 1; attempt <= attempts; attempt++) {
              try {
                const response =
                  await fetch(
                    url,
                    options
                  );

                const responseText =
                  await response.text();

                if (!response.ok) {
                  throw new Error(
                    `SenseCraft API failed: ${response.status} ${responseText}`
                  );
                }

                return JSON.parse(
                  responseText
                );

              } catch (error) {
                lastError = error;

                console.error(
                  `SenseCraft API attempt ${attempt}/${attempts} failed:`,
                  error.message
                );

                if (attempt < attempts) {
                  await sleep(
                    attempt * 5000
                  );
                }
              }
            }

            throw lastError;
          }

          async function main() {
            if (!process.env.SENSECRAFT_API_KEY) {
              throw new Error(
                "SENSECRAFT_API_KEY is missing."
              );
            }

            fs.mkdirSync(
              folder,
              { recursive: true }
            );

            let history = {
              updatedAt: null,
              readings: []
            };

            if (fs.existsSync(historyFile)) {
              history =
                JSON.parse(
                  fs.readFileSync(
                    historyFile,
                    "utf8"
                  )
                );
            }

            history.readings =
              Array.isArray(history.readings)
                ? history.readings
                : [];

            /*
             * GitHub checks twice per hour.
             *
             * Scheduled executions are ignored when the
             * previous saved reading is less than 50 minutes old.
             *
             * Manual workflow_dispatch runs are always allowed.
             */
            const eventName =
              process.env.GITHUB_EVENT_NAME;

            const lastReading =
              history.readings.length > 0
                ? history.readings[
                    history.readings.length - 1
                  ]
                : null;

            if (
              eventName === "schedule" &&
              lastReading?.timestamp
            ) {
              const lastTime =
                new Date(
                  lastReading.timestamp
                ).getTime();

              const minutesSinceLastReading =
                (
                  Date.now() -
                  lastTime
                ) / 60000;

              if (
                Number.isFinite(minutesSinceLastReading) &&
                minutesSinceLastReading < minimumSpacingMinutes
              ) {
                console.log(
                  `Last reading was ${minutesSinceLastReading.toFixed(1)} minutes ago.`
                );

                console.log(
                  `Minimum spacing is ${minimumSpacingMinutes} minutes.`
                );

                console.log(
                  "Nothing to save during this backup run."
                );

                return;
              }
            }

            const payload =
              await fetchWithRetry(
                endpoint,
                {
                  headers: {
                    "Api-Key":
                      process.env.SENSECRAFT_API_KEY,

                    "Accept":
                      "application/json"
                  }
                }
              );

            if (
              payload.code !== 200 ||
              !payload.result
            ) {
              throw new Error(
                `Unexpected SenseCraft response: ${JSON.stringify(payload)}`
              );
            }

            const result =
              payload.result;

            const rawStatus =
              Number(
                result?.deviceStatus?.status
              );

            const intervalSeconds =
              Number(
                result?.dataaccess?.interval
              );

            const reading = {
              timestamp:
                new Date().toISOString(),

              battery:
                Number(
                  result?.battery?.level ??
                  result?.battery?.voltage ??
                  result?.battery?.value
                ),

              charging:
                Boolean(
                  result?.battery?.charging
                ),

              temperature:
                Number(
                  result?.sensor?.temp ??
                  result?.sensor?.temperature
                ),

              humidity:
                Number(
                  result?.sensor?.humidity
                ),

              status:
                statusLabel(
                  rawStatus
                ),

              rawStatus:
                Number.isFinite(rawStatus)
                  ? rawStatus
                  : null,

              refreshIntervalMinutes:
                Number.isFinite(intervalSeconds)
                  ? Math.round(
                      intervalSeconds / 60
                    )
                  : null,

              deepSleepDisabled:
                result?.power?.deep_sleep_disabled === undefined
                  ? null
                  : Number(
                      result.power.deep_sleep_disabled
                    )
            };

            for (const key of [
              "battery",
              "temperature",
              "humidity"
            ]) {
              if (
                !Number.isFinite(
                  reading[key]
                )
              ) {
                throw new Error(
                  `Invalid ${key} value from SenseCraft API.`
                );
              }
            }

            const cutoff =
              Date.now() -
              (
                retentionDays *
                24 *
                60 *
                60 *
                1000
              );

            history.readings.push(
              reading
            );

            history.readings =
              history.readings
                .filter(item => {
                  const time =
                    new Date(
                      item.timestamp
                    ).getTime();

                  return (
                    Number.isFinite(time) &&
                    time >= cutoff
                  );
                })
                .sort(
                  (a, b) =>
                    new Date(
                      a.timestamp
                    ).getTime() -
                    new Date(
                      b.timestamp
                    ).getTime()
                );

            history.updatedAt =
              reading.timestamp;

            fs.writeFileSync(
              historyFile,
              `${JSON.stringify(
                history,
                null,
                2
              )}\n`,
              "utf8"
            );

            const csvHeader = [
              "timestamp",
              "status",
              "rawStatus",
              "battery",
              "charging",
              "temperature",
              "humidity",
              "refreshIntervalMinutes",
              "deepSleepDisabled"
            ];

            const csvRows =
              history.readings.map(
                item => [
                  item.timestamp,
                  item.status ?? "Unknown",
                  item.rawStatus ?? "",
                  item.battery ?? "",
                  item.charging ?? "",
                  item.temperature ?? "",
                  item.humidity ?? "",
                  item.refreshIntervalMinutes ?? "",
                  item.deepSleepDisabled ?? ""
                ]
              );

            const csvContent = [
              csvHeader
                .map(csvEscape)
                .join(","),

              ...csvRows.map(
                row =>
                  row
                    .map(csvEscape)
                    .join(",")
              )
            ].join("\n") + "\n";

            fs.writeFileSync(
              csvFile,
              csvContent,
              "utf8"
            );

            console.log(
              "Saved E1002 reading:",
              reading
            );

            console.log(
              `E1002 reports refresh interval: ${reading.refreshIntervalMinutes} minutes.`
            );

            console.log(
              `Retaining ${retentionDays} days of history.`
            );

            console.log(
              `Created CSV log: ${csvFile}`
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit updated sensor history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sensor-history.json data/e1002-status-history.csv

          if git diff --cached --quiet; then
            echo "No sensor-history changes to commit."
            exit 0
          fi

          git commit -m "Update E1002 sensor and status history"
          git push
